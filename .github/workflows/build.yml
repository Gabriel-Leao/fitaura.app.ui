name: Build APK & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        id: build
        run: |
          BUILD_URL=$(eas build --platform android --profile preview --non-interactive --json | jq -r '.[0].artifacts.buildUrl // .[0].buildDetailsPageUrl')
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT

      - name: Wait for build and download APK
        run: |
          echo "Waiting for EAS build to complete..."
          eas build:list --platform android --limit 1 --json > /tmp/build_info.json
          BUILD_ID=$(cat /tmp/build_info.json | jq -r '.[0].id')
          
          for i in $(seq 1 60); do
            STATUS=$(eas build:view $BUILD_ID --json | jq -r '.status')
            echo "Status: $STATUS (attempt $i/60)"
            if [ "$STATUS" = "FINISHED" ]; then
              APK_URL=$(eas build:view $BUILD_ID --json | jq -r '.artifacts.buildUrl')
              curl -L "$APK_URL" -o fit-care.apk
              echo "APK downloaded successfully"
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 30
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Fit Care ${{ github.ref_name }}"
          body: |
            ## Fit Care ${{ github.ref_name }}
            
            ### Instalação
            1. Baixe o arquivo `fit-care.apk`
            2. No Android, habilite **Instalar de fontes desconhecidas**
            3. Abra o APK e instale
            
            ### Demo
            [Ver demonstração em vídeo](https://www.youtube.com/watch?v=1lH7rLDA05w)
          files: fit-care.apk
          draft: false
          prerelease: false